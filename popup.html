<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Gibberish Decoder</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<h1>Gibberish Decoder</h1>
<p class="sub">فارسی ↔ انگلیسی — فقط روی همین دستگاه، بدون ارسال متن به هیچ سروری</p>

<label class="row"><input type="checkbox" id="enabled"> فعال باشد</label>
<label class="row"><input type="checkbox" id="showButton"> دکمه شناور کنار باکس چت</label>
<label class="row"><input type="checkbox" id="warnBeforeSend"> قبل از ارسال با Enter، جلوی متن چرت را بگیرد</label>
<label class="row"><input type="checkbox" id="fixNumbers"> عددها هم تبدیل شوند (۱۲۳ ↔ 123)</label>
<label class="row"><input type="checkbox" id="fixZwnj"> نیم‌فاصله درست شود (می روم → می‌روم، کتاب ها → کتاب‌ها)</label>
<label class="row"><input type="checkbox" id="spellEn"> پیشنهاد غلط املایی انگلیسی</label>
<label class="row"><input type="checkbox" id="spellFa"> پیشنهاد غلط املایی فارسی</label>
<label class="row"><input type="checkbox" id="strictChatOnly"> فقط باکس‌های چت چندخطی (نه همه باکس‌های قابل ویرایش)</label>

<label class="row">زبان رابط کاربری
<select id="uiLang">
<option value="fa">فارسی</option>
<option value="en">English</option>
</select>
</label>

<hr>
<h2>جعبه تست — بدون نیاز به رفتن به سایتی</h2>
<p class="hint">متن چرت را اینجا بچسبان، مثلا: <code>sghl ]di</code> یا <code>اثممخ</code></p>
<textarea id="testInput" rows="4" placeholder="sghl ]di"></textarea>
<div class="btns">
<button id="testAuto">تبدیل خودکار</button>
<button id="testFa">همه را به فارسی برگردان</button>
<button id="testEn">همه را به انگلیسی برگردان</button>
<button id="copyOut">کپی خروجی</button>
</div>
<textarea id="testOutput" rows="4" readonly></textarea>
<div id="testIssues"></div>

<p class="foot">چیدمان پشتیبانی‌شده: ویندوز فارسی (ایران) 0429 ↔ انگلیسی آمریکا 0409. نسخه 1.0.5 — کاملا آفلاین، فونت وزیر.</p>
<script src="src/dictionaries.js"></script>
<script src="src/decoder.js"></script>
<script src="popup.js"></script>
</body>
</html>
